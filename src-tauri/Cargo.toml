[package]
name = "baidupcs-share-client"
version = "1.0.0"
description = "BaiduPCS Share Direct Download Client"
authors = ["you"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"

[features]
custom-protocol = ["tauri/custom-protocol"]