[package]
name = "baidupcs-share-client"
version = "1.0.0"
description = "百度网盘分享直下客户端"
authors = ["cybaijie"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
